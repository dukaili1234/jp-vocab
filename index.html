<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5efe3">
<title>日语词汇卡</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="词汇卡">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f5efe3;
    --card: #1f3a5c;
    --card-inner: #2e4b70;
    --tag-bg: #f6c9cf;
    --tag-fg: #2a3e5c;
    --pink: #f3b8c2;
    --red: #d9402b;
    --text: #ffffff;
    --muted: #c9d4e3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans", "Microsoft YaHei", "Yu Gothic", sans-serif;
    color: var(--tag-fg);
    display: flex; flex-direction: column; align-items: center;
  }
  .app { width: 100%; max-width: 420px; padding: calc(16px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; min-height: 100%; }

  /* 顶部栏 */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid var(--card); background: transparent; color: var(--card);
    padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .chip.active { background: var(--card); color: #fff; }
  .chips.small .chip { border-width: 1px; padding: 2px 9px; font-size: 12px; font-weight: 500; }
  .icon-btn { border: none; background: transparent; font-size: 20px; cursor: pointer; color: var(--card); padding: 4px 6px; }

  .stats { font-size: 12px; color: #6b7a90; margin: 10px 0 6px; }
  .progress-wrap { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #6b7a90; margin-bottom: 14px; }
  .progress { flex: 1; height: 6px; background: #e4dccb; border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--red); width: 0; transition: width .3s; }

  /* 卡片 */
  .stage { flex: 1; display: flex; align-items: flex-start; justify-content: center; }
  .card {
    width: 100%; min-height: 380px;
    background: var(--card); color: var(--text);
    border-radius: 16px; padding: 22px 22px 26px;
    box-shadow: 0 10px 28px rgba(31, 58, 92, .25);
    cursor: pointer; user-select: none;
    transition: transform .25s ease, opacity .25s ease;
    touch-action: pan-y;
  }
  .card.out-left  { transform: translateX(-120%) rotate(-8deg); opacity: 0; }
  .card.out-right { transform: translateX(120%) rotate(8deg); opacity: 0; }
  .card.in { animation: pop .25s ease; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .tag {
    display: inline-block; background: var(--tag-bg); color: var(--tag-fg);
    font-size: 13px; padding: 3px 9px; border-radius: 4px; font-weight: 600;
  }
  .cat { margin-left: 6px; font-size: 12px; color: var(--muted); }
  .word-row { display: flex; align-items: center; gap: 12px; margin: 18px 0 10px; }
  .word {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Songti SC", serif;
    font-size: 40px; font-weight: 800; letter-spacing: 1px; line-height: 1.15; word-break: keep-all;
  }
  .word.long { font-size: 30px; }
  .badge {
    background: var(--red); color: #fff; font-size: 12px; font-weight: 800;
    padding: 3px 7px; border-radius: 3px; font-family: Georgia, serif; flex-shrink: 0;
  }
  .speak { margin-left: auto; flex-shrink: 0; background: rgba(255,255,255,.12); border: none; color: #fff; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; }
  .meta { color: var(--pink); font-size: 15px; margin-bottom: 8px; }
  .meta .sep { margin: 0 8px; opacity: .8; }
  .meaning { font-size: 16px; font-weight: 700; margin-bottom: 18px; line-height: 1.5; }
  .example {
    background: var(--card-inner); border-radius: 8px; padding: 10px 14px;
    font-size: 15px; line-height: 1.7; margin-bottom: 10px;
  }
  .example .jp { color: #fff; line-height: 2; }
  .example .jp b { color: var(--pink); font-weight: 700; }
  .example rt { font-size: 10px; color: var(--muted); }
  .example .zh { color: var(--muted); }
  .rel { font-size: 14px; line-height: 1.7; color: #e8eef6; margin-top: 16px; }

  .hidden-area { transition: opacity .2s; }
  .card.covered .hidden-area { opacity: 0; pointer-events: none; }
  .tap-hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; display: none; }
  .card.covered .tap-hint { display: block; }

  /* 底部按钮 */
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 18px; }
  .btn { border: none; border-radius: 12px; padding: 14px 0; font-size: 16px; font-weight: 700; cursor: pointer; }
  .actions .btn { padding: 10px 0; line-height: 1.3; }
  .actions .btn small { display: block; font-size: 11px; font-weight: 500; opacity: .75; }
  .btn.no  { background: #fff; color: var(--red); border: 2px solid var(--red); }
  .btn.mid { background: #fff; color: var(--card); border: 2px solid var(--card); }
  .btn.yes { background: var(--card); color: #fff; }
  .btn:active { transform: scale(.97); }
  .sub-actions { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; }
  .link { background: none; border: none; color: #6b7a90; cursor: pointer; font-size: 13px; padding: 4px; }
  .credit { text-align: center; font-size: 11px; color: #a39a88; margin-top: 14px; }
  .credit a { color: inherit; }

  .done { text-align: center; color: var(--card); padding: 60px 10px; }
  .done h2 { font-size: 22px; }

  /* 面板 */
  .panel-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 10; }
  .panel {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 100%; max-width: 420px; max-height: 80vh; overflow: auto;
    background: var(--bg); border-radius: 16px 16px 0 0; padding: 18px; z-index: 11; display: none;
  }
  .panel.show, .panel-mask.show { display: block; }
  .panel h3 { margin: 0 0 12px; color: var(--card); }
  .list-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid #e4dccb; font-size: 14px; }
  .list-item .w { font-weight: 700; color: var(--card); font-size: 16px; }
  .list-item .r { color: #8a96a8; margin-left: 6px; }
  .st { font-size: 12px; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; }
  .st.ok { background: #dfeee0; color: #2f7a3a; }
  .st.ng { background: #fbe0dc; color: var(--red); }
  .st.learn { background: #fdf0d5; color: #9a6a10; }
  .st.new { background: #e6e9ef; color: #6b7a90; }
  .form label { display: block; font-size: 13px; color: #6b7a90; margin: 8px 0 4px; }
  .form input, .form select, .search {
    width: 100%; padding: 9px 10px; border: 1px solid #d8cfbd; border-radius: 8px; font-size: 15px; background: #fff;
  }
  .form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form .btn { width: 100%; margin-top: 14px; }
  .backup { display: flex; gap: 8px; margin-top: 14px; }
  .backup .btn { flex: 1; padding: 10px 0; font-size: 14px; }
  .more { text-align: center; color: #8a96a8; font-size: 12px; padding: 10px; }

  /* 练习方向 */
  .seg { display: flex; background: #e9e1d1; border-radius: 10px; padding: 3px; margin-top: 12px; }
  .seg button { flex: 1; border: none; background: none; padding: 7px 0; border-radius: 8px; font-size: 13px; color: #6b7a90; cursor: pointer; }
  .seg button.active { background: #fff; color: var(--card); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  /* 中→日：正面是中文 */
  .prompt-zh { font-size: 26px; font-weight: 800; line-height: 1.4; margin: 18px 0 6px; }
  .prompt-pos { color: var(--pink); font-size: 14px; margin-bottom: 18px; }
  /* 听音：正面是大喇叭 */
  .listen-btn { display: block; margin: 34px auto 26px; width: 96px; height: 96px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.12); color: #fff; font-size: 40px; cursor: pointer; }
  .card:not(.covered) .listen-btn { width: 56px; height: 56px; font-size: 24px; margin: 6px auto 12px; }
  .ex-play { float: right; background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 0 0 0 8px; }

  /* 设置面板 */
  .set-row { padding: 12px 0; border-bottom: 1px solid #e4dccb; }
  .set-row .label { font-size: 14px; color: var(--card); font-weight: 600; margin-bottom: 8px; }
  .set-row .hint { font-size: 12px; color: #8a96a8; margin-top: 6px; line-height: 1.5; }

  /* 统计面板 */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tile { background: #fffdf8; border-radius: 10px; padding: 10px 12px; }
  .tile .v { font-size: 24px; font-weight: 700; color: #1d2b3f; }
  .tile .k { font-size: 12px; color: #6b7a90; margin-top: 2px; }
  .chart-card { background: #fffdf8; border-radius: 10px; padding: 12px 12px 8px; margin-bottom: 12px; position: relative; }
  .chart-card h4 { margin: 0 0 2px; font-size: 14px; color: #1d2b3f; }
  .chart-card .sub { font-size: 12px; color: #6b7a90; margin-bottom: 10px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: #52606f; margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .plot { display: flex; align-items: flex-end; gap: 4px; height: 110px; border-bottom: 1px solid #e4dccb; }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch;
    background: none; border: none; padding: 0; cursor: pointer; position: relative; }
  .col:focus-visible { outline: 2px solid #2f5f9e; outline-offset: 2px; border-radius: 4px; }
  .col .seg-fill { width: 100%; }
  .col .seg-fill + .seg-fill { margin-top: 2px; }
  .col .seg-fill.top { border-radius: 4px 4px 0 0; }
  .col .val { font-size: 11px; color: #1d2b3f; text-align: center; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .xaxis { display: flex; gap: 4px; margin-top: 4px; }
  .xaxis span { flex: 1; text-align: center; font-size: 10px; color: #8a96a8; font-variant-numeric: tabular-nums; }
  .hbar { display: flex; height: 14px; gap: 2px; margin: 4px 0 2px; }
  .hbar > div { height: 100%; }
  .hbar > div:first-child { border-radius: 4px 0 0 4px; }
  .hbar > div:last-child { border-radius: 0 4px 4px 0; }
  .hrow { margin-bottom: 10px; font-size: 13px; color: #1d2b3f; }
  .hrow .meta2 { display: flex; justify-content: space-between; font-size: 12px; color: #6b7a90; }
  .tip { position: absolute; pointer-events: none; background: #1d2b3f; color: #fff; font-size: 12px; line-height: 1.5;
    padding: 6px 9px; border-radius: 6px; white-space: nowrap; z-index: 2; display: none; transform: translate(-50%, -100%); }
  details.table { margin-top: 8px; font-size: 12px; color: #6b7a90; }
  details.table summary { cursor: pointer; }
  details.table table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  details.table td, details.table th { padding: 3px 4px; text-align: right; border-bottom: 1px solid #efe8da; }
  details.table td:first-child, details.table th:first-child { text-align: left; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="chips" id="levels"></div>
    <div>
      <button class="icon-btn" id="btnStats" title="学习统计"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" style="vertical-align:-3px"><rect x="2" y="10" width="3.5" height="8" rx="1"/><rect x="8.25" y="5" width="3.5" height="13" rx="1"/><rect x="14.5" y="2" width="3.5" height="16" rx="1"/></svg></button>
      <button class="icon-btn" id="btnList" title="单词本">☰</button>
      <button class="icon-btn" id="btnAdd" title="添加单词">＋</button>
      <button class="icon-btn" id="btnSettings" title="设置">⚙</button>
    </div>
  </div>
  <div class="chips small" id="cats"></div>

  <div class="stats" id="stats"></div>
  <div class="progress-wrap">
    <div class="progress"><div id="bar"></div></div>
    <span id="progText">0 / 0</span>
  </div>

  <div class="stage" id="stage"></div>

  <div class="actions" id="actions">
    <button class="btn no" data-grade="0">不认识<small></small></button>
    <button class="btn mid" data-grade="1">模糊<small></small></button>
    <button class="btn yes" data-grade="2">认识<small></small></button>
  </div>
  <div class="seg" id="dirs">
    <button data-dir="jp">日 → 中</button>
    <button data-dir="zh">中 → 日</button>
    <button data-dir="listen">🎧 听音</button>
  </div>
  <div class="credit" id="credit"></div>
</div>

<div class="panel-mask" id="mask"></div>
<div class="panel" id="panel"></div>

<script>
  // ?db=open 加载可商用词库（预览中），学习记录单独存
  window.VOCAB_DB = new URLSearchParams(location.search).get("db") === "open" ? "open" : "vocab";
  document.write(`<script src="${window.VOCAB_DB === "open" ? "words-open.js" : "words.js"}"><\/script>`);
</script>
<script src="app.js"></script>
</body>
</html>
